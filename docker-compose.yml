services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neonmonkey}
      POSTGRES_USER: ${POSTGRES_USER:-neonmonkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neonmonkey_dev_password}
    volumes:
      - neonmonkey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-neonmonkey}
      PGUSER: ${POSTGRES_USER:-neonmonkey}
      PGPASSWORD: ${POSTGRES_PASSWORD:-neonmonkey_dev_password}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  neonmonkey-postgres:
