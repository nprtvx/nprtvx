services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neonmonkey
      POSTGRES_USER: neonmonkey
      POSTGRES_PASSWORD: neonmonkey
    ports:
      - "5432:5432"
    volumes:
      - neonmonkey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonmonkey -d neonmonkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      DATABASE_URL: postgres://neonmonkey:neonmonkey@postgres:5432/neonmonkey
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  neonmonkey-postgres:
