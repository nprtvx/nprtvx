services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airms
      POSTGRES_USER: airms
      POSTGRES_PASSWORD: airms
    ports:
      - "5432:5432"
    volumes:
      - airms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airms"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    environment:
      DATABASE_URL: postgres://airms:airms@postgres:5432/airms
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airms-postgres:
