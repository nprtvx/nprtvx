services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neonmonkey}
      POSTGRES_USER: ${POSTGRES_USER:-neonmonkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neonmonkey_dev_password}
    volumes:
      - neonmonkey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-neonmonkey}:${POSTGRES_PASSWORD:-neonmonkey_dev_password}@postgres:5432/${POSTGRES_DB:-neonmonkey}
      PORT: "10000"
      STATIC_DIR: /app/static
    ports:
      - "${APP_PORT:-8090}:10000"

volumes:
  neonmonkey-postgres:
