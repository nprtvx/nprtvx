services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neonmonkey
      POSTGRES_USER: neonmonkey
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - neonmonkey-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonmonkey -d neonmonkey"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/neonmonkey
      DB_USER: neonmonkey
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  neonmonkey-postgres:
