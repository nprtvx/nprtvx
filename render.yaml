services:
  - type: web
    name: neonmonkey
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neonmonkey-db
          property: connectionString
      - key: STATIC_DIR
        value: /app/static

databases:
  - name: neonmonkey-db
    plan: free
    databaseName: neonmonkey
    user: neonmonkey
