services:
  - type: web
    name: neonmonkey
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neonmonkey-db
          property: connectionString

databases:
  - name: neonmonkey-db
    plan: free
    databaseName: neonmonkey
    user: neonmonkey
