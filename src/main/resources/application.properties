spring.application.name=neonmonkey
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neonmonkey}
spring.datasource.username=${DB_USER:neonmonkey}
spring.datasource.password=${DB_PASSWORD:neonmonkey}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
